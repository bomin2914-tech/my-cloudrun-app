<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BFS & DFS Graph Visualizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .node-circle {
      transition: all 0.3s ease;
    }
    .edge-line {
      transition: stroke 0.3s ease, stroke-width 0.3s ease;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
  <div class="max-w-6xl mx-auto p-4 sm:p-6 space-y-6">
    <!-- Header -->
    <header class="border-b border-slate-700 pb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 via-indigo-300 to-teal-300 bg-clip-text text-transparent">
          BFS & DFS Graph Traversal Visualizer
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">
          Google Cloud Run 백엔드 연동 너비 우선 탐색(BFS) & 깊이 우선 탐색(DFS) 알고리즘 시각화
        </p>
      </div>
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-950 text-emerald-400 border border-emerald-800">
          <span class="w-2 h-2 mr-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          GAS WebApp Active
        </span>
      </div>
    </header>

    <!-- Cloud Run Config Card -->
    <section class="bg-slate-800/80 rounded-xl p-4 sm:p-5 border border-slate-700 shadow-lg">
      <h2 class="text-sm font-semibold text-slate-300 mb-3 flex items-center gap-2">
        <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
        Cloud Run 백엔드 API 연동 설정
      </h2>
      <div class="flex flex-col sm:flex-row gap-3">
        <div class="flex-1">
          <input
            id="serverUrl"
            type="url"
            placeholder="예: https://my-cloudrun-app-xxxxx.run.app"
            class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>
        <button
          id="btnTestConnection"
          onclick="testConnection()"
          class="px-4 py-2.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs sm:text-sm font-medium transition text-slate-200"
        >
          연결 테스트
        </button>
      </div>
      <p id="connectionStatus" class="text-xs text-slate-400 mt-2"></p>
    </section>

    <!-- Main Workspace -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Left Panel: Controls & Graph Input -->
      <div class="space-y-4">
        <!-- Controls -->
        <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 space-y-4">
          <h3 class="text-sm font-semibold text-slate-300">탐색 알고리즘 설정</h3>
          <div>
            <label class="block text-xs text-slate-400 mb-1.5 font-medium">알고리즘 선택</label>
            <div class="grid grid-cols-2 gap-2">
              <button
                id="btnAlgoBFS"
                onclick="setAlgorithm('BFS')"
                class="py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm transition"
              >
                BFS (너비 우선 / 큐)
              </button>
              <button
                id="btnAlgoDFS"
                onclick="setAlgorithm('DFS')"
                class="py-2 text-xs font-semibold rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition"
              >
                DFS (깊이 우선 / 스택)
              </button>
            </div>
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">시작 노드</label>
            <input
              id="startNode"
              type="text"
              value="A"
              class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label class="block text-xs text-slate-400 mb-1 font-medium">간선 데이터 (Edge List JSON)</label>
            <textarea
              id="edgeInput"
              rows="5"
              class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-700 text-xs font-mono text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >[["A","B"], ["A","C"], ["B","D"], ["B","E"], ["C","F"], ["E","F"]]</textarea>
          </div>

          <div class="pt-2 flex flex-col gap-2">
            <button
              id="btnRunTraversal"
              onclick="startTraversal()"
              class="w-full py-2.5 rounded-lg bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-sm font-medium transition shadow-md"
            >
              🚀 탐색 실행 및 시각화
            </button>
            <div class="flex gap-2">
              <button
                onclick="resetGraph()"
                class="flex-1 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs text-slate-300 transition"
              >
                초기화
              </button>
              <button
                onclick="loadPresetGraph()"
                class="flex-1 py-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-xs text-slate-300 transition"
              >
                예제 그래프 로드
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Panel: Visualization Canvas & Step Details -->
      <div class="lg:col-span-2 space-y-4">
        <!-- Canvas -->
        <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700 flex flex-col">
          <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
              <span>그래프 탐색 시각화 캔버스</span>
              <span id="stepBadge" class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300">대기 중</span>
            </h3>
            <div class="flex items-center gap-1.5">
              <button onclick="prevStep()" class="px-2.5 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600">◀ 이전</button>
              <button onclick="togglePlay()" id="btnPlay" class="px-3 py-1 text-xs rounded bg-blue-600 hover:bg-blue-500 font-medium">재생 ▶</button>
              <button onclick="nextStep()" class="px-2.5 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600">다음 ▶</button>
            </div>
          </div>

          <!-- SVG Visualizer Canvas -->
          <div class="w-full h-80 sm:h-96 bg-slate-950 rounded-lg border border-slate-800 relative overflow-hidden flex items-center justify-center">
            <svg id="graphSvg" class="w-full h-full">
              <!-- Dynamically populated edges & nodes -->
            </svg>
          </div>
        </div>

        <!-- Traversal State Inspector (Queue / Stack, Visited) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
            <h4 class="text-xs font-semibold text-slate-400 mb-2 flex items-center justify-between">
              <span id="dataStructureTitle">큐 (Queue) 상태 [FIFO]</span>
              <span class="text-[10px] text-slate-500">너비 우선</span>
            </h4>
            <div id="dataStructureBox" class="min-h-[50px] p-2 bg-slate-900 rounded border border-slate-800 flex items-center gap-2 overflow-x-auto text-xs font-mono text-blue-400">
              <span class="text-slate-600">(비어 있음)</span>
            </div>
          </div>

          <div class="bg-slate-800/80 rounded-xl p-4 border border-slate-700">
            <h4 class="text-xs font-semibold text-slate-400 mb-2">방문 순서 (Visited Order)</h4>
            <div id="visitedBox" class="min-h-[50px] p-2 bg-slate-900 rounded border border-slate-800 flex items-center gap-2 overflow-x-auto text-xs font-mono text-emerald-400">
              <span class="text-slate-600">(방문 없음)</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentAlgorithm = 'BFS';
    let simulationSteps = [];
    let currentStepIndex = 0;
    let timer = null;

    const sampleGraph = {
      nodes: ['A', 'B', 'C', 'D', 'E', 'F'],
      positions: {
        'A': { x: 180, y: 50 },
        'B': { x: 90,  y: 150 },
        'C': { x: 270, y: 150 },
        'D': { x: 50,  y: 270 },
        'E': { x: 150, y: 270 },
        'F': { x: 270, y: 270 }
      },
      edges: [
        ['A', 'B'], ['A', 'C'],
        ['B', 'D'], ['B', 'E'],
        ['C', 'F'], ['E', 'F']
      ]
    };

    function setAlgorithm(algo) {
      currentAlgorithm = algo;
      const btnBFS = document.getElementById('btnAlgoBFS');
      const btnDFS = document.getElementById('btnAlgoDFS');
      const dsTitle = document.getElementById('dataStructureTitle');

      if (algo === 'BFS') {
        btnBFS.className = 'py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm transition';
        btnDFS.className = 'py-2 text-xs font-semibold rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition';
        dsTitle.innerText = '큐 (Queue) 상태 [FIFO]';
      } else {
        btnDFS.className = 'py-2 text-xs font-semibold rounded-lg bg-indigo-600 text-white shadow-sm transition';
        btnBFS.className = 'py-2 text-xs font-semibold rounded-lg bg-slate-700 text-slate-300 hover:bg-slate-600 transition';
        dsTitle.innerText = '스택 (Stack) 상태 [LIFO]';
      }
      resetGraph();
    }

    function renderGraph(activeNode = null, visitedNodes = new Set()) {
      const svg = document.getElementById('graphSvg');
      svg.innerHTML = '';

      // Draw edges
      sampleGraph.edges.forEach(([u, v]) => {
        const p1 = sampleGraph.positions[u];
        const p2 = sampleGraph.positions[v];
        if (!p1 || !p2) return;

        const isTraversed = visitedNodes.has(u) && visitedNodes.has(v);
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', p1.x);
        line.setAttribute('y1', p1.y);
        line.setAttribute('x2', p2.x);
        line.setAttribute('y2', p2.y);
        line.setAttribute('stroke', isTraversed ? '#38bdf8' : '#334155');
        line.setAttribute('stroke-width', isTraversed ? '3' : '2');
        line.setAttribute('class', 'edge-line');
        svg.appendChild(line);
      });

      // Draw nodes
      sampleGraph.nodes.forEach(nodeId => {
        const pos = sampleGraph.positions[nodeId];
        if (!pos) return;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', pos.x);
        circle.setAttribute('cy', pos.y);
        circle.setAttribute('r', '20');

        let fill = '#1e293b';
        let stroke = '#64748b';
        if (nodeId === activeNode) {
          fill = '#f59e0b';
          stroke = '#fbbf24';
        } else if (visitedNodes.has(nodeId)) {
          fill = '#10b981';
          stroke = '#34d399';
        }

        circle.setAttribute('fill', fill);
        circle.setAttribute('stroke', stroke);
        circle.setAttribute('stroke-width', '2.5');
        circle.setAttribute('class', 'node-circle shadow-lg');

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', pos.x);
        text.setAttribute('y', pos.y + 5);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#f8fafc');
        text.setAttribute('font-size', '12px');
        text.setAttribute('font-weight', 'bold');
        text.textContent = nodeId;

        g.appendChild(circle);
        g.appendChild(text);
        svg.appendChild(g);
      });
    }

    function startTraversal() {
      const serverUrl = document.getElementById('serverUrl').value.trim();
      const startNode = document.getElementById('startNode').value.trim() || 'A';

      if (serverUrl && typeof google !== 'undefined' && google.script) {
        document.getElementById('connectionStatus').innerText = 'Cloud Run API 요청 중...';
        google.script.run
          .withSuccessHandler(function(res) {
            if (res.success) {
              simulationSteps = res.data.steps;
              currentStepIndex = 0;
              document.getElementById('connectionStatus').innerText = 'Cloud Run 탐색 데이터 수신 완료!';
              applyStep(0);
            } else {
              alert('백엔드 오류: ' + res.error + '\n로컬 시뮬레이션 모드로 전환합니다.');
              runLocalSimulation(startNode);
            }
          })
          .withFailureHandler(function(err) {
            alert('GAS 통신 오류: ' + err + '\n로컬 시뮬레이션으로 실행합니다.');
            runLocalSimulation(startNode);
          })
          .fetchTraversalData(serverUrl, {
            algorithm: currentAlgorithm,
            start_node: startNode,
            edges: sampleGraph.edges
          });
      } else {
        runLocalSimulation(startNode);
      }
    }

    function runLocalSimulation(start) {
      simulationSteps = [];
      const adj = {};
      sampleGraph.nodes.forEach(n => adj[n] = []);
      sampleGraph.edges.forEach(([u, v]) => {
        adj[u].push(v);
        adj[v].push(u);
      });
      sampleGraph.nodes.forEach(n => adj[n].sort());

      const visited = [];
      const visitedSet = new Set();

      if (currentAlgorithm === 'BFS') {
        const queue = [start];
        visitedSet.add(start);
        simulationSteps.push({ current: start, queue: [...queue], visited: [...visitedSet] });

        while (queue.length > 0) {
          const u = queue.shift();
          visited.push(u);
          simulationSteps.push({ current: u, queue: [...queue], visited: [...visited] });

          for (const v of adj[u]) {
            if (!visitedSet.has(v)) {
              visitedSet.add(v);
              queue.push(v);
              simulationSteps.push({ current: u, queue: [...queue], visited: [...visited] });
            }
          }
        }
      } else {
        const stack = [start];
        const visitedDfs = new Set();

        while (stack.length > 0) {
          const u = stack.pop();
          if (!visitedDfs.has(u)) {
            visitedDfs.add(u);
            visited.push(u);
            simulationSteps.push({ current: u, queue: [...stack], visited: [...visited] });

            for (let i = adj[u].length - 1; i >= 0; i--) {
              const v = adj[u][i];
              if (!visitedDfs.has(v)) {
                stack.push(v);
                simulationSteps.push({ current: u, queue: [...stack], visited: [...visited] });
              }
            }
          }
        }
      }

      currentStepIndex = 0;
      applyStep(0);
    }

    function applyStep(idx) {
      if (!simulationSteps || simulationSteps.length === 0) return;
      if (idx < 0) idx = 0;
      if (idx >= simulationSteps.length) idx = simulationSteps.length - 1;
      currentStepIndex = idx;

      const step = simulationSteps[idx];
      document.getElementById('stepBadge').innerText = `스텝 ${idx + 1} / ${simulationSteps.length}`;
      renderGraph(step.current, new Set(step.visited));

      const dsBox = document.getElementById('dataStructureBox');
      if (step.queue && step.queue.length > 0) {
        dsBox.innerHTML = step.queue.map(item => `<span class="px-2 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">${item}</span>`).join(' ➜ ');
      } else {
        dsBox.innerHTML = '<span class="text-slate-600">(비어 있음)</span>';
      }

      const vBox = document.getElementById('visitedBox');
      if (step.visited && step.visited.length > 0) {
        vBox.innerHTML = step.visited.map(item => `<span class="px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800">${item}</span>`).join(' ➜ ');
      } else {
        vBox.innerHTML = '<span class="text-slate-600">(방문 없음)</span>';
      }
    }

    function nextStep() {
      if (currentStepIndex < simulationSteps.length - 1) {
        applyStep(currentStepIndex + 1);
      }
    }

    function prevStep() {
      if (currentStepIndex > 0) {
        applyStep(currentStepIndex - 1);
      }
    }

    function togglePlay() {
      const btn = document.getElementById('btnPlay');
      if (timer) {
        clearInterval(timer);
        timer = null;
        btn.innerText = '재생 ▶';
        btn.className = 'px-3 py-1 text-xs rounded bg-blue-600 hover:bg-blue-500 font-medium';
      } else {
        btn.innerText = '일시정지 ❚❚';
        btn.className = 'px-3 py-1 text-xs rounded bg-amber-600 hover:bg-amber-500 font-medium';
        timer = setInterval(() => {
          if (currentStepIndex < simulationSteps.length - 1) {
            nextStep();
          } else {
            togglePlay();
          }
        }, 800);
      }
    }

    function resetGraph() {
      if (timer) togglePlay();
      simulationSteps = [];
      currentStepIndex = 0;
      document.getElementById('stepBadge').innerText = '대기 중';
      document.getElementById('dataStructureBox').innerHTML = '<span class="text-slate-600">(비어 있음)</span>';
      document.getElementById('visitedBox').innerHTML = '<span class="text-slate-600">(방문 없음)</span>';
      renderGraph();
    }

    function loadPresetGraph() {
      resetGraph();
    }

    function testConnection() {
      const url = document.getElementById('serverUrl').value.trim();
      const statusEl = document.getElementById('connectionStatus');
      if (!url) {
        statusEl.innerText = '⚠️ Cloud Run 서버 URL을 입력하세요.';
        statusEl.className = 'text-xs text-amber-400 mt-2';
        return;
      }
      statusEl.innerText = '서버 헬스체크 연결 중...';
      statusEl.className = 'text-xs text-blue-400 mt-2';

      fetch(url.replace(/\/+$/, '') + '/health')
        .then(r => r.json())
        .then(data => {
          statusEl.innerText = '✅ 백엔드 정상 연결 확인: ' + JSON.stringify(data);
          statusEl.className = 'text-xs text-emerald-400 mt-2';
        })
        .catch(err => {
          statusEl.innerText = '⚠️ 연결 확인 중 (CORS 또는 URL 확인 필요): ' + err.message;
          statusEl.className = 'text-xs text-slate-400 mt-2';
        });
    }

    // Initial render
    window.onload = function() {
      renderGraph();
    };
  </script>
</body>
</html>
